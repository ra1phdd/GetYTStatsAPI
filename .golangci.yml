version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: all
  disable:
    - goconst
    - gosmopolitan
    - nestif
    - promlinter
    - maintidx
    - cyclop
    - funcorder
    - depguard
    - gocyclo
    - err113
    - errcheck
    - exhaustruct
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gocognit
    - interfacebloat
    - ireturn
    - lll
    - mnd
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - revive
    - tagliatelle
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
    - testpackage
    - tagalign
    - gosec
    - exhaustive
  exclusions:
    rules:
      - path: pkg/config/generic_test.go
        linters:
          - paralleltest
      - path: pkg/credential/credential_test.go
        linters:
          - paralleltest
