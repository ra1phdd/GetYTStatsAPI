services:
  postgres:
    image: postgres:17-alpine
    container_name: getytstatsapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-getytstatsapi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-getytstatsapi}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.campaign-api
    container_name: getytstatsapi-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOGGER_LEVEL: ${LOGGER_LEVEL:-warn}
      HTTP_ADDRESS: ${HTTP_ADDRESS:-:8080}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME: ${POSTGRES_DB:-getytstatsapi}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL:-http://telegram-bot:8081}
      TELEGRAM_AUTH_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_INTERNAL_SERVICE_ID: ${API_INTERNAL_SERVICE_ID:-campaign-api}
      API_INTERNAL_SERVICE_SECRET: ${API_INTERNAL_SERVICE_SECRET}
      API_INTERNAL_PEER_SERVICE_ID: ${BOT_INTERNAL_SERVICE_ID:-telegram-bot}
      API_INTERNAL_PEER_SERVICE_SECRET: ${BOT_INTERNAL_SERVICE_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      EXPORT_JWT_SECRET: ${EXPORT_JWT_SECRET}
      ACCESS_JWT_SECRET: ${ACCESS_JWT_SECRET}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET}
    command: ["/app/migrator", "-direction", "up"]
    restart: "no"

  campaign-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.campaign-api
    container_name: getytstatsapi-campaign-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      LOGGER_LEVEL: ${LOGGER_LEVEL:-warn}
      HTTP_ADDRESS: ${HTTP_ADDRESS:-:8080}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME: ${POSTGRES_DB:-getytstatsapi}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL:-http://telegram-bot:8081}
      TELEGRAM_AUTH_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_INTERNAL_SERVICE_ID: ${API_INTERNAL_SERVICE_ID:-campaign-api}
      API_INTERNAL_SERVICE_SECRET: ${API_INTERNAL_SERVICE_SECRET}
      API_INTERNAL_PEER_SERVICE_ID: ${BOT_INTERNAL_SERVICE_ID:-telegram-bot}
      API_INTERNAL_PEER_SERVICE_SECRET: ${BOT_INTERNAL_SERVICE_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      EXPORT_JWT_SECRET: ${EXPORT_JWT_SECRET}
      ACCESS_JWT_SECRET: ${ACCESS_JWT_SECRET}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET}
    ports:
      - "${API_PORT:-8080}:8080"

  telegram-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.telegram-bot
    container_name: getytstatsapi-telegram-bot
    restart: unless-stopped
    depends_on:
      campaign-api:
        condition: service_started
    environment:
      LOGGER_LEVEL: ${LOGGER_LEVEL:-warn}
      TELEGRAM_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEBHOOK_ADDRESS: ${BOT_WEBHOOK_ADDRESS:-:8081}
      API_BASE_URL: http://campaign-api:8080
      BOT_INTERNAL_SERVICE_ID: ${BOT_INTERNAL_SERVICE_ID:-telegram-bot}
      BOT_INTERNAL_SERVICE_SECRET: ${BOT_INTERNAL_SERVICE_SECRET}
      BOT_INTERNAL_PEER_SERVICE_ID: ${API_INTERNAL_SERVICE_ID:-campaign-api}
      BOT_INTERNAL_PEER_SERVICE_SECRET: ${API_INTERNAL_SERVICE_SECRET}
    ports:
      - "${BOT_WEBHOOK_PORT:-8081}:8081"

volumes:
  postgres-data:
